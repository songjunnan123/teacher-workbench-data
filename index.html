<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>班主任工作台</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#5fc4a8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="班主任">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --mint:#5fc4a8;--mint-d:#3aa888;--mint-l:#e6f5ef;
    --ink:#1a2e26;--ink-2:#4a5e54;--ink-3:#7a8e84;
    --line:#dce8e2;--bg:#f4f8f6;--card:#fff;
    --pink:#e8697e;--pink-l:#fde6ea;
    --amber:#d9882e;--amber-l:#fdf0d8;
    --blue:#4a8fc4;--blue-l:#e0edf6;
    --red:#d04545;
  }
  html,body{height:100%;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg);overflow:hidden}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,textarea,select{font-family:inherit;font-size:14px}
  ::placeholder{color:var(--ink-3)}

  /* 顶部栏 */
  .topbar{
    height:56px;background:#fff;border-bottom:1px solid var(--line);
    display:flex;align-items:center;padding:0 20px;gap:12px;
  }
  .topbar .logo{font-size:18px;font-weight:700;color:var(--mint-d);letter-spacing:1px;display:flex;align-items:center;gap:8px}
  .topbar .logo .ic{font-size:22px}
  .topbar .class-name{font-size:13px;color:var(--ink-2);padding:4px 12px;background:var(--mint-l);border-radius:16px}
  .topbar .spacer{flex:1}
  .topbar .top-btn{padding:6px 14px;border-radius:8px;font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
  .topbar .top-btn:hover{background:var(--mint-l)}
  .topbar .top-btn.primary{background:var(--mint);color:#fff}
  .topbar .top-btn.primary:hover{background:var(--mint-d)}

  /* 主体布局 */
  .layout{display:flex;height:calc(100% - 56px)}
  .sidebar{
    width:200px;background:#fff;border-right:1px solid var(--line);
    padding:12px 8px;flex-shrink:0;overflow-y:auto;
  }
  .nav-item{
    display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:8px;
    font-size:14px;color:var(--ink-2);margin-bottom:2px;transition:.15s;width:100%;text-align:left;
  }
  .nav-item:hover{background:var(--mint-l)}
  .nav-item.active{background:var(--mint);color:#fff;font-weight:500}
  .nav-item .ic{font-size:18px;width:22px;text-align:center}
  .nav-item .badge{margin-left:auto;background:rgba(255,255,255,.25);font-size:11px;padding:1px 8px;border-radius:10px}
  .nav-item:not(.active) .badge{background:var(--mint-l);color:var(--mint-d)}

  .content{flex:1;overflow-y:auto;padding:20px 28px}
  .page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  .page-title{font-size:22px;font-weight:700;color:var(--ink)}
  .page-sub{font-size:12px;color:var(--ink-3);margin-top:2px}
  .page-actions{display:flex;gap:8px;align-items:center}
  .btn{padding:7px 16px;border-radius:8px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
  .btn-primary{background:var(--mint);color:#fff}
  .btn-primary:hover{background:var(--mint-d)}
  .btn-ghost{background:#fff;border:1px solid var(--line);color:var(--ink-2)}
  .btn-ghost:hover{background:var(--mint-l);border-color:var(--mint)}
  .btn-danger{background:var(--red);color:#fff}
  .btn-sm{padding:4px 10px;font-size:12px}

  /* 通用 */
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
  .empty{text-align:center;padding:40px 20px;color:var(--ink-3);font-size:14px}
  .empty .ic{font-size:40px;display:block;margin-bottom:10px;opacity:.4}
  .row-flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .pill{padding:3px 10px;border-radius:12px;font-size:11px;font-weight:500}
  .pill-mint{background:var(--mint-l);color:var(--mint-d)}
  .pill-amber{background:var(--amber-l);color:var(--amber)}
  .pill-pink{background:var(--pink-l);color:var(--pink)}
  .pill-blue{background:var(--blue-l);color:var(--blue)}

  /* 输入 */
  .field{margin-bottom:12px}
  .field label{display:block;font-size:12px;color:var(--ink-2);margin-bottom:4px;font-weight:500}
  .field input,.field textarea,.field select{
    width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:8px;outline:none;background:#fff;
  }
  .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--mint);box-shadow:0 0 0 3px var(--mint-l)}
  .field textarea{resize:vertical;min-height:60px}
  .field-row{display:flex;gap:12px}
  .field-row .field{flex:1}

  /* 表格 */
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;padding:10px 12px;background:var(--mint-l);color:var(--ink);font-weight:600;border-bottom:1px solid var(--line)}
  td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
  tr:hover td{background:var(--mint-l)}
  .tbl-wrap{background:#fff;border:1px solid var(--line);border-radius:12px;overflow-x:auto;-webkit-overflow-scrolling:touch}

  /* 日程 */
  .sch-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px;display:flex;gap:14px;align-items:flex-start}
  .sch-card .left{min-width:80px;text-align:center;padding-right:14px;border-right:1px dashed var(--line)}
  .sch-card .day{font-size:15px;font-weight:700;color:var(--mint-d)}
  .sch-card .range{font-size:11px;color:var(--ink-3);margin-top:2px}
  .sch-card .body{flex:1}
  .sch-card .title{font-size:15px;font-weight:600;color:var(--ink);margin-bottom:4px}
  .sch-card .desc{font-size:12px;color:var(--ink-2);line-height:1.5}
  .sch-card .ops{display:flex;gap:6px;margin-top:6px}
  .sch-card .ops button{font-size:11px;padding:2px 8px;border-radius:6px;border:1px solid var(--line);color:var(--ink-2)}
  .sch-card .ops button:hover{background:var(--mint-l);border-color:var(--mint)}
  .sch-card.done{opacity:.55}
  .sch-card.done .title{text-decoration:line-through}

  /* 积分 */
  .pts-tbl th,.pts-tbl td{text-align:center}
  .pts-tbl .name-cell{text-align:left;font-weight:500}
  .score-pill{display:inline-block;padding:3px 12px;border-radius:14px;font-weight:700;min-width:40px}
  .score-pos{background:var(--mint-l);color:var(--mint-d)}
  .score-neg{background:var(--pink-l);color:var(--pink)}
  .score-zero{background:#f0f0f0;color:var(--ink-3)}
  .pts-btn{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:#fff}
  .pts-plus{background:var(--mint)}
  .pts-minus{background:var(--pink)}
  .pts-btn:hover{opacity:.85}

  /* 台账 */
  .jr-card{background:#fff;border:1px solid var(--line);border-left:4px solid var(--mint);border-radius:10px;padding:14px 16px;margin-bottom:10px}
  .jr-card.starred{border-left-color:var(--amber);background:#fffcf5}
  .jr-card .head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
  .jr-card .name{font-weight:600;color:var(--ink);font-size:14px}
  .jr-card .date{font-size:12px;color:var(--ink-3)}
  .jr-card .tags{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
  .jr-card .content{font-size:13px;color:var(--ink-2);line-height:1.6;margin-top:4px}
  .jr-card .ops{display:flex;gap:8px;margin-top:8px}

  /* 请假 */
  .lv-card{background:#fff;border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:10px;padding:14px 16px;margin-bottom:10px}
  .lv-card.returned{border-left-color:var(--pink);background:#fef7f8}
  .lv-card .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .lv-card .name{font-weight:600;font-size:14px}

  /* 座次表 */
  .seating{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;background:#fff;padding:16px;border:1px solid var(--line);border-radius:12px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .seat{aspect-ratio:1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:500;color:#fff;cursor:pointer;position:relative;transition:.15s}
  .seat:hover{transform:scale(1.05);z-index:2}
  .seat.boy{background:linear-gradient(135deg,#7fb8d9,#5a9bc4)}
  .seat.girl{background:linear-gradient(135deg,#ff9eb5,#ff7a96)}
  .seat.empty{background:var(--mint-l);color:var(--ink-3);border:1px dashed var(--line)}
  .seat .num{font-size:9px;opacity:.7;position:absolute;top:3px;left:4px}
  .seat .nm{font-size:11px;line-height:1.2;text-align:center;padding:0 2px}

  /* 值日表 */
  .duty-tbl th,.duty-tbl td{padding:10px;text-align:center;font-size:13px}
  .duty-tbl th{background:var(--mint-l)}

  /* 成绩 */
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .bar-label{width:60px;font-size:12px;color:var(--ink-2);text-align:right}
  .bar-track{flex:1;background:var(--mint-l);border-radius:6px;height:18px;overflow:hidden}
  .bar-fill{height:100%;border-radius:6px;background:var(--mint);display:flex;align-items:center;justify-content:flex-end;padding-right:8px;color:#fff;font-size:11px;font-weight:600}
  .bar-fill.alt{background:var(--pink)}

  /* 花名册 */
  .roster-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px}
  .stu-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 10px;text-align:center;cursor:pointer;transition:.15s}
  .stu-card:hover{border-color:var(--mint);box-shadow:0 4px 12px rgba(95,196,168,.15)}
  .stu-card .avatar{width:44px;height:44px;border-radius:50%;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:700}
  .stu-card.boy .avatar{background:linear-gradient(135deg,#7fb8d9,#5a9bc4)}
  .stu-card.girl .avatar{background:linear-gradient(135deg,#ff9eb5,#ff7a96)}
  .stu-card .name{font-size:13px;font-weight:600}
  .stu-card .id{font-size:11px;color:var(--ink-3);margin-top:2px}

  /* 弹窗 */
  .modal{position:fixed;inset:0;background:rgba(20,40,30,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
  .modal.open{display:flex}
  .modal-box{background:#fff;border-radius:14px;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.2)}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
  .modal-head h3{font-size:17px;font-weight:600}
  .modal-head .close{font-size:24px;color:var(--ink-3);line-height:1}
  .modal-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}

  /* toast */
  .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(20,40,30,.9);color:#fff;padding:10px 22px;border-radius:22px;font-size:13px;z-index:200;opacity:0;transition:opacity .25s;pointer-events:none}
  .toast.show{opacity:1}

  /* tabs */
  .tabs{display:flex;gap:6px;margin-bottom:14px}
  .tab{padding:6px 16px;border-radius:20px;font-size:13px;background:#fff;border:1px solid var(--line);color:var(--ink-2)}
  .tab.active{background:var(--mint);color:#fff;border-color:var(--mint);font-weight:500}

  .search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 12px;flex:1;max-width:320px}
  .search input{border:none;outline:none;flex:1;background:transparent;font-size:13px}
  .search .ic{color:var(--ink-3)}

  .checkbox-row{display:flex;align-items:center;gap:8px}
  .checkbox-row input[type=checkbox]{width:16px;height:16px;accent-color:var(--mint)}

  @media(max-width:760px){
    .sidebar{width:56px}.sidebar .nav-item .label,.sidebar .nav-item .badge{display:none}
    .sidebar .nav-item{justify-content:center;padding:12px 0}
    .content{padding:12px}
    .topbar{padding:0 12px;gap:8px}
    .topbar .logo span:last-child{display:none}
    .page-title{font-size:19px}
    .page-head{flex-wrap:wrap;gap:10px}
    .page-actions{width:100%;justify-content:space-between}
    .search{max-width:none}
    .modal{padding:12px;align-items:flex-end}
    .modal-box{max-height:92vh;border-radius:14px 14px 0 0;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
  }
  /* 手机竖屏：顶部安全区 */
  @supports(padding:env(safe-area-inset-top)){
    .topbar{padding-top:env(safe-area-inset-top)}
  }
  .tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

  /* ---------- 附件 ---------- */
  .attach-area{margin-top:4px}
  .attach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px}
  .attach-item{position:relative;border-radius:8px;overflow:hidden;background:var(--mint-l);border:1px solid var(--line)}
  .attach-thumb{width:100%;aspect-ratio:1;object-fit:cover;display:block;cursor:zoom-in;background:#e8f5f0}
  .attach-name{font-size:11px;color:var(--ink-2);padding:6px 22px 6px 8px;line-height:1.3;word-break:break-all;cursor:pointer;display:block}
  .attach-ext{font-size:10px;color:var(--ink-3);padding:0 8px 6px}
  .attach-item .rm{position:absolute;top:3px;right:3px;width:20px;height:20px;border:none;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:12px;line-height:20px;padding:0;cursor:pointer;text-align:center}
  .attach-add{border:1.5px dashed var(--mint);border-radius:8px;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--mint-d);font-size:11px;cursor:pointer;background:rgba(127,209,185,.06)}
  .attach-add .ic{font-size:20px;line-height:1}
  .attach-add:hover{background:rgba(127,209,185,.15)}
  .attach-uploading{border:1.5px dashed var(--line);border-radius:8px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--ink-3)}
  .card-attach{margin-top:8px}
  .card-attach .attach-grid{grid-template-columns:repeat(auto-fill,minmax(64px,1fr))}
  .card-attach .attach-thumb{width:100%;aspect-ratio:1;border-radius:6px}
  .card-attach .attach-file{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--ink-2);background:var(--mint-l);border:1px solid var(--line);border-radius:6px;padding:3px 8px;margin:2px 4px 2px 0;cursor:pointer;max-width:100%}
  .attach-count{font-size:11px;color:var(--ink-3)}
  .lb{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:400;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:20px}
  .lb.open{display:flex}
  .lb img{max-width:92vw;max-height:76vh;border-radius:8px}
  .lb-cap{color:#fff;font-size:13px;word-break:break-all;text-align:center}
  .lb-close{position:absolute;top:16px;right:16px;width:38px;height:38px;border:none;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;font-size:18px;cursor:pointer}
  .lb-dl{border:none;border-radius:8px;background:var(--mint);color:#fff;padding:8px 18px;font-size:13px;cursor:pointer}

  /* ---------- 只读模式（家长端 ?ro=1） ---------- */
  body.readonly .top-btn#syncPushBtn,
  body.readonly .top-btn#syncCfgBtn,
  body.readonly .top-btn#importBtn,
  body.readonly .top-btn#exportBtn,
  body.readonly .top-btn#manageClassBtn,
  body.readonly .btn-primary,
  body.readonly .btn-danger,
  body.readonly .ops,
  body.readonly .attach-add,
  body.readonly .attach-item .rm,
  body.readonly .sch-card .ops,
  body.readonly .jr-card .ops,
  body.readonly .lv-card .ops,
  body.readonly .stu-card{cursor:default}
  body.readonly #addSch,
  body.readonly #addJr,
  body.readonly #addLv,
  body.readonly #addStu,
  body.readonly #addGrade,
  body.readonly #addDutyDay,
  body.readonly #autoDuty,
  body.readonly #resetSeat,
  body.readonly #addSeatCol,
  body.readonly #resetPts,
  body.readonly #exportPts,
  body.readonly #exportGrade{display:none!important}
  body.readonly .sch-card .ops,
  body.readonly .jr-card .ops,
  body.readonly .lv-card .ops{display:none!important}
  body.readonly .pts-btn,
  body.readonly .seat{cursor:default!important;pointer-events:none}
  body.readonly .pts-btn{pointer-events:auto;opacity:.5}
  body.readonly .top-btn#syncPullBtn::after{content:' · 只读';font-size:11px;color:var(--ink-3)}
  body.readonly .topbar::before{content:'👨\200d🏫 老师视图只读 · 数据来自云端';font-size:11px;color:var(--ink-3);margin-right:8px}
  @media(max-width:760px){body.readonly .topbar::before{display:none}}
  .sync-banner{position:fixed;bottom:0;left:0;right:0;background:var(--mint-d);color:#fff;font-size:12px;padding:6px 16px;display:none;justify-content:space-between;align-items:center;z-index:50}
  .sync-banner.show{display:flex}
  .sync-banner .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#aef;background:rgba(255,255,255,.7);margin-right:6px;animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo"><span class="ic">📚</span><span>班主任工作台</span></div>
  <span class="class-name" id="className">三年级二班</span>
  <div class="spacer"></div>
  <button class="top-btn" id="syncPullBtn" title="从云端拉取最新数据">⬇ 拉取</button>
  <button class="top-btn" id="syncPushBtn" title="把本地修改推送到云端">⬆ 推送</button>
  <button class="top-btn" id="syncCfgBtn" title="云端同步设置">☁ 同步</button>
  <button class="top-btn" id="importBtn" title="导入数据">📥 导入</button>
  <button class="top-btn" id="exportBtn" title="导出数据">📤 导出</button>
  <button class="top-btn primary" id="manageClassBtn">⚙️ 班级设置</button>
</div>

<div class="layout">
  <div class="sidebar">
    <button class="nav-item active" data-view="schedule"><span class="ic">📅</span><span class="label">日程安排</span><span class="badge" id="schBadge">0</span></button>
    <button class="nav-item" data-view="points"><span class="ic">⭐</span><span class="label">积分统计</span></button>
    <button class="nav-item" data-view="journal"><span class="ic">📝</span><span class="label">工作台账</span></button>
    <button class="nav-item" data-view="leave"><span class="ic">📋</span><span class="label">请假管理</span></button>
    <button class="nav-item" data-view="seating"><span class="ic">🪑</span><span class="label">座次表</span></button>
    <button class="nav-item" data-view="duty"><span class="ic">🎺</span><span class="label">值日表</span></button>
    <button class="nav-item" data-view="grade"><span class="ic">📊</span><span class="label">成绩分析</span></button>
    <button class="nav-item" data-view="roster"><span class="ic">👥</span><span class="label">学生花名册</span></button>
  </div>

  <div class="content" id="content">
    <!-- 各视图动态渲染 -->
  </div>
</div>

<!-- 弹窗 -->
<div class="modal" id="modal"><div class="modal-box" id="modalBox"><div class="modal-head"><h3 id="modalTitle"></h3><button class="close" id="modalClose">×</button></div><div id="modalContent"></div><div class="modal-foot" id="modalFoot"></div></div></div>
<div class="toast" id="toast"></div>
<div class="sync-banner" id="syncBanner"><span><span class="dot"></span><span id="syncBannerTxt">同步中…</span></span><button class="top-btn" id="syncBannerClose" style="color:#fff">×</button></div>
<div class="lb" id="lightbox">
  <button class="lb-close" onclick="closeLightbox()">×</button>
  <img id="lbImg" alt="">
  <div class="lb-cap" id="lbCap"></div>
  <button class="lb-dl" onclick="lbDownload()">⬇ 下载原图</button>
</div>

<script>
// =================== 数据层 ===================
const KEY='teacher_workbench_v1';
let DB=null;
function defaultDB(){
  return {
    className:'三年级二班',
    teacher:'王老师',

// ---------- 附件存储（IndexedDB） ----------
const IDB_NAME='twb_files',IDB_STORE='files';
let idbReady=null;
function idbOpen(){
  if(idbReady)return idbReady;
  idbReady=new Promise((res,rej)=>{
    const rq=indexedDB.open(IDB_NAME,1);
    rq.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains(IDB_STORE))d.createObjectStore(IDB_STORE)};
    rq.onsuccess=e=>res(e.target.result);
    rq.onerror=e=>rej(rq.error);
  });
  return idbReady;
}
async function filePut(id,name,type,size,blob){
  const db=await idbOpen();
  return new Promise((res,rej)=>{
    const tx=db.transaction(IDB_STORE,'readwrite');
    tx.objectStore(IDB_STORE).put({id,name,type,size,blob},id);
    tx.oncomplete=res;tx.onerror=()=>rej(tx.error);
  });
}
async function fileGet(id){
  const db=await idbOpen();
  return new Promise((res,rej)=>{
    const tx=db.transaction(IDB_STORE,'readonly');
    const rq=tx.objectStore(IDB_STORE).get(id);
    rq.onsuccess=()=>res(rq.result||null);rq.onerror=()=>rej(rq.error);
  });
}
async function fileDel(id){
  const db=await idbOpen();
  return new Promise((res,rej)=>{
    const tx=db.transaction(IDB_STORE,'readwrite');
    tx.objectStore(IDB_STORE).delete(id);
    tx.oncomplete=res;tx.onerror=()=>rej(tx.error);
  });
}
async function fileAll(){
  const db=await idbOpen();
  return new Promise((res,rej)=>{
    const tx=db.transaction(IDB_STORE,'readonly');
    const rq=tx.objectStore(IDB_STORE).getAll();
    rq.onsuccess=()=>res(rq.result||[]);rq.onerror=()=>rej(rq.error);
  });
}
async function fileClear(){const db=await idbOpen();return new Promise((res,rej)=>{const tx=db.transaction(IDB_STORE,'readwrite');tx.objectStore(IDB_STORE).clear();tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}

// 图片压缩：最长边 1600px，jpeg 0.85，非图片原样返回
function compressImage(file){
  return new Promise(res=>{
    if(!file.type.startsWith('image/')||file.type==='image/gif')return res(file);
    const url=URL.createObjectURL(file);const img=new Image();
    img.onload=()=>{
      const MAX=1600;let{width:w,height:h}=img;
      if(Math.max(w,h)>MAX){const r=MAX/Math.max(w,h);w=Math.round(w*r);h=Math.round(h*r)}
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      cv.toBlob(b=>{URL.revokeObjectURL(url);res(b&&b.size<file.size?b:file)},'image/jpeg',0.85);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);res(file)};
    img.src=url;
  });
}
function isImg(t){return (t||'').startsWith('image/')}
function fmtSize(n){if(n==null)return'';if(n<1024)return n+' B';if(n<1048576)return(n/1024).toFixed(1)+' KB';return(n/1048576).toFixed(1)+' MB'}
function fileIcon(f){const t=f.type||'',n=f.name||'';
  if(t.startsWith('image/'))return'🖼️';
  if(t.startsWith('audio/'))return'🎵';
  if(t.startsWith('video/'))return'🎬';
  if(t.includes('pdf'))return'📕';
  if(/\.(doc|docx)$/i.test(n))return'📘';
  if(/\.(xls|xlsx|csv)$/i.test(n))return'📗';
  if(/\.(ppt|pptx)$/i.test(n))return'📙';
  if(/\.(zip|rar|7z)$/i.test(n))return'🗜️';
  return'📎';
}
const urlCache={}; // fileId -> objectURL
async function fileUrl(id){
  if(urlCache[id])return urlCache[id];
  // 只读模式（家长端）：直接走云端同源 URL，不读本地 IndexedDB
  if(typeof READONLY!=='undefined'&&READONLY){
    const base=(typeof SYNC_BASE!=='undefined'?SYNC_BASE:'./');
    const cb=(typeof CACHE_BUST!=='undefined'?CACHE_BUST:Date.now());
    return urlCache[id]=`${base}attachments/${encodeURIComponent(id)}.dat?v=${cb}`;
  }
  const rec=await fileGet(id);
  if(!rec)return null;
  return urlCache[id]=URL.createObjectURL(rec.blob);
}

}

// ---------- 附件上传组件（编辑弹窗内用） ----------
// ctx={keep:[元数据...],fresh:[File...],removed:[元数据...]}
let attachCtx=null;
function attachWidgetHTML(){
  const c=attachCtx;
  const keepHtml=c.keep.map((m,i)=>`
    <div class="attach-item">
      ${isImg(m.type)?`<img class="attach-thumb" data-fid="${m.id}" onclick="openLightboxById('${m.id}')" src="" alt="${esc(m.name)}">`:`
        <span class="attach-name" onclick="openLightboxById('${m.id}')">${esc(m.name)}</span>
        <div class="attach-ext">${esc(fmtSize(m.size))}</div>`}
      <button class="rm" type="button" onclick="attachRmKeep(${i})">×</button>
    </div>`).join('');
  const freshHtml=c.fresh.map((f,i)=>`
    <div class="attach-item">
      ${isImg(f.type)?`<img class="attach-thumb" src="${URL.createObjectURL(f)}">`:`
        <span class="attach-name">${esc(f.name)}</span>
        <div class="attach-ext">${esc(fmtSize(f.size))} · 新</div>`}
      <button class="rm" type="button" onclick="attachRmFresh(${i})">×</button>
    </div>`).join('');
  const busy=c.busy?'<div class="attach-uploading">处理中…</div>':'';
  return `<div class="attach-grid">${keepHtml}${freshHtml}${busy}
    <div class="attach-add" onclick="document.getElementById('attachInput').click()">
      <span class="ic">📎</span><span>上传附件</span>
    </div>
  </div><input type="file" id="attachInput" multiple style="display:none" onchange="attachPick(this)">`;
}
function attachInit(rec){attachCtx={keep:recFiles(rec).slice(),fresh:[],removed:[],busy:false};attachCtx.keep.forEach(m=>metaMap[m.id]=m)}
function attachRerender(){
  if(!attachCtx)return;
  const box=document.getElementById('attachBox');
  if(box)box.innerHTML=attachWidgetHTML();
  fillThumbs(box);
}
window.attachRmKeep=i=>{const c=attachCtx;c.removed.push(c.keep[i]);c.keep.splice(i,1);attachRerender()};
window.attachRmFresh=i=>{attachCtx.fresh.splice(i,1);attachRerender()};
window.attachPick=async input=>{
  const c=attachCtx;if(!c)return;
  const files=[...input.files];input.value='';
  if(!files.length)return;
  c.busy=true;attachRerender();
  for(const f of files){
    try{
      const cf=await compressImage(f);
      // 压缩后的 Blob 会丢文件名，重新包装成 File
      c.fresh.push(cf instanceof File?cf:new File([cf],f.name||'图片.jpg',{type:cf.type||f.type||'image/jpeg'}));
    }catch(e){c.fresh.push(f)}
  }
  c.busy=false;attachRerender();
};
// 保存记录时调用：把 fresh 写入 IndexedDB，删除 removed，返回最终元数据数组
async function attachCommit(){
  const c=attachCtx;const metas=c.keep.slice();
  for(const f of c.fresh){
    const id='f_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);
    await filePut(id,f.name,f.type,f.size,f);
    metas.push({id,name:f.name,type:f.type,size:f.size});
  }
  for(const m of c.removed)await fileDel(m.id);
  return metas;
}

function daysUntil(d){const t=new Date(d);t.setHours(0,0,0,0);const n=new Date();n.setHours(0,0,0,0);return Math.round((t-n)/86400000)}

function renderSchedule(){
  const range=currentRange;
  const today=new Date();
  let list=DB.schedules.slice();
  if(range==='day')list=list.filter(s=>s.start<=todayStr()&&s.end>=todayStr());
  else if(range==='week'){const w=new Date(today);w.setDate(w.getDate()-7);list=list.filter(s=>new Date(s.start)>=w||new Date(s.end)>=w)}
  else if(range==='month')list=list.filter(s=>s.start.slice(0,7)===todayStr().slice(0,7));
  list.sort((a,b)=>a.start<b.start?-1:1);

  content.innerHTML=`
    <div class="page-head">
      <div><div class="page-title">日程安排</div><div class="page-sub">共 ${list.length} 条 · 未完成 ${list.filter(s=>!s.done).length}</div></div>
      <div class="page-actions">
        <div class="tabs" style="margin:0">
          <button class="tab ${range==='day'?'active':''}" data-r="day">本日</button>
          <button class="tab ${range==='week'?'active':''}" data-r="week">本周</button>
          <button class="tab ${range==='month'?'active':''}" data-r="month">本月</button>
          <button class="tab ${range==='all'?'active':''}" data-r="all">全部</button>
        </div>
        <button class="btn btn-primary" id="addSch">+ 新增</button>
      </div>
    </div>
    <div id="schList"></div>
  `;
  document.querySelectorAll('.tab[data-r]').forEach(t=>t.onclick=()=>{currentRange=t.dataset.r;render()});
  document.getElementById('addSch').onclick=()=>editSchedule();

  const wrap=document.getElementById('schList');
  if(!list.length){wrap.innerHTML='<div class="empty"><span class="ic">📅</span>暂无日程，点击右上角「新增」添加</div>';return}
  wrap.innerHTML=list.map(s=>{
    const days=daysUntil(s.start);
    const span=daysBetween(s.start,s.end);
    let badge='';
    if(s.done)badge='<span class="pill pill-mint">已完成</span>';
    else if(days<0)badge=`<span class="pill pill-pink">逾期 ${-days} 天</span>`;
    else if(days===0)badge='<span class="pill pill-amber">今天</span>';
    else badge=`<span class="pill pill-mint">还有 ${days} 天</span>`;
    return `<div class="sch-card ${s.done?'done':''}">
      <div class="left"><div class="day">${fmtDate(s.start)}</div><div class="range">${span>1?'~ '+fmtDate(s.end)+'<br>跨'+span+'天':'单日'}</div></div>
      <div class="body">
        <div class="title">${esc(s.title)}</div>
        ${s.desc?`<div class="desc">${esc(s.desc)}</div>`:''}
        <div class="row-flex" style="margin-top:6px">${badge}</div>
        ${cardAttachHTML(s)}
        <div class="ops">
          <button onclick="toggleSch(${s.id})">${s.done?'取消完成':'标记完成'}</button>
          <button onclick="editSchedule(${s.id})">编辑</button>
          <button onclick="delSch(${s.id})">删除</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

// ---------- 成绩分析 ----------
function renderGrade(){
  const subs=['chinese','math','english','science','moral'];
  const subNames={chinese:'语文',math:'数学',english:'英语',science:'科学',moral:'道德'};
  const avgs=subs.map(s=>{const v=DB.grades.map(g=>g[s]||0);return v.reduce((a,b)=>a+b,0)/(v.length||1)});
  const total=DB.grades.map(g=>subs.reduce((a,s)=>a+(g[s]||0),0));
  const avgTotal=total.reduce((a,b)=>a+b,0)/(total.length||1);
  // 分数段
  const ranges=[[90,100],[80,89],[70,79],[60,69],[0,59]];
  const rangeCounts=ranges.map(([a,b])=>total.filter(t=>t>=a*5&&t<=b*5).length);

  content.innerHTML=`
    <div class="page-head">
      <div><div class="page-title">成绩分析</div><div class="page-sub">共 ${DB.grades.length} 人 · 总分平均 ${avgTotal.toFixed(1)}</div></div>
      <div class="page-actions">
        <button class="btn btn-ghost" id="addGrade">➕ 录入成绩</button>
        <button class="btn btn-ghost" id="exportGrade">📤 导出</button>
      </div>
    </div>
    <div class="card"><h4 style="margin-bottom:12px">📈 学科平均分</h4>${subs.map((s,i)=>`<div class="bar-row"><div class="bar-label">${subNames[s]}</div><div class="bar-track"><div class="bar-fill" style="width:${avgs[i]}%">${avgs[i].toFixed(1)}</div></div></div>`).join('')}</div>
    <div class="card"><h4 style="margin-bottom:12px">📊 总分分数段</h4>${ranges.map(([a,b],i)=>`<div class="bar-row"><div class="bar-label">${a}-${b}</div><div class="bar-track"><div class="bar-fill ${i>=2?'alt':''}" style="width:${rangeCounts[i]*10}%">${rangeCounts[i]}人</div></div></div>`).join('')}</div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>学号</th><th>姓名</th>${subs.map(s=>`<th>${subNames[s]}</th>`).join('')}<th>总分</th><th>操作</th></tr></thead>
      <tbody>
        ${DB.grades.map(g=>{const t=subs.reduce((a,s)=>a+(g[s]||0),0);return `<tr>
          <td>${getStu(g.stuId)?.no||'-'}</td><td>${esc(stuName(g.stuId))}</td>
          ${subs.map(s=>`<td>${g[s]||0}</td>`).join('')}
          <td>${t}</td>
          <td><button class="btn btn-sm btn-ghost" onclick="editGrade(${g.id})">编辑</button> <button class="btn btn-sm btn-ghost" onclick="delGrade(${g.id})">删除</button></td>
        </tr>`}).join('')}
      </tbody>
    </table></div>
  `;
  document.getElementById('addGrade').onclick=()=>editGrade();
  document.getElementById('exportGrade').onclick=exportGrade;
}

function blobToB64(blob){return new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.readAsDataURL(blob)})}
function b64ToBlob(b64,type){const bin=atob(b64);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:type||'application/octet-stream'})}
function clearUrlCache(){Object.keys(urlCache).forEach(k=>{try{URL.revokeObjectURL(urlCache[k])}catch(e){}delete urlCache[k]})}

// =================== 云端同步模块（GitHub + Pages） ===================
const SYNC_KEY='twb_sync_cfg';
let SYNC_CFG=null;          // {user,repo,branch,token}
let READONLY=false;
let SYNC_BASE='./';          // 静态资源基础路径（同源 = Pages 根）
let CACHE_BUST=Date.now();
let _syncing=false;

function loadSyncCfg(){
  try{const s=localStorage.getItem(SYNC_KEY);SYNC_CFG=s?JSON.parse(s):null}catch(e){SYNC_CFG=null}
  return SYNC_CFG;
}
function saveSyncCfg(cfg){SYNC_CFG=cfg||null;if(cfg)localStorage.setItem(SYNC_KEY,JSON.stringify(cfg));else localStorage.removeItem(SYNC_KEY)}

let TEACHER=false;
// URL 参数：?ro=1 强制只读；?teacher=1 老师模式（绕过家长自动只读）；?src=<url> 指定静态根
function parseSyncURL(){
  const p=new URLSearchParams(location.search);
  if(p.get('ro')==='1'||p.get('readonly')==='1')READONLY=true;
  if(p.get('teacher')==='1'||p.get('edit')==='1')TEACHER=true;
  const src=p.get('src');
  if(src)SYNC_BASE=src.endsWith('/')?src:src+'/';
}
parseSyncURL();

// 通用 GitHub Contents API 调用
function ghApi(method,path,body){
  const c=SYNC_CFG;
  if(!c)throw new Error('未配置同步');
  const url=`https://api.github.com/repos/${c.user}/${c.repo}/contents/${path}?ref=${c.branch}`;
  const opt={method,headers:{
    'Accept':'application/vnd.github+json',
    'Authorization':'Bearer '+c.token,
    'X-GitHub-Api-Version':'2022-11-28'
  }};
  if(body!==undefined){opt.body=JSON.stringify(body);opt.headers['Content-Type']='application/json'}
  return fetch(url,opt).then(async r=>{
    const txt=await r.text();
    let json=null;try{json=txt?JSON.parse(txt):null}catch(e){}
    if(!r.ok){const e=new Error((json&&json.message)||('HTTP '+r.status));e.status=r.status;e.body=json;throw e}
    return json;
  });
}
function u8ToB64(u8){let b='';for(let i=0;i<u8.length;i++)b+=String.fromCharCode(u8[i]);return btoa(b)}
function strToB64(s){return u8ToB64(new TextEncoder().encode(s))}
function b64ToU8(b64){const bin=atob(b64);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u}
function blobToB64Url(blob){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const s=r.result;res(s.slice(s.indexOf(',')+1))};r.readAsDataURL(blob)})}
async function ghGetFile(path){try{const j=await ghApi('GET',path);return{sha:j.sha,content:j.content||'',encoding:j.encoding}}catch(e){if(e.status===404)return null;throw e}}
function ghPutFile(path,b64Content,message,sha){const body={message,branch:SYNC_CFG.branch,content:b64Content};if(sha)body.sha=sha;return ghApi('PUT',path,body)}
function ghDeleteFile(path,sha,message){return ghApi('DELETE',path,{message,branch:SYNC_CFG.branch,sha})}
async function ghListDir(path){try{return await ghApi('GET',path)}catch(e){if(e.status===404)return[];throw e}}

function showBanner(txt){document.getElementById('syncBannerTxt').textContent=txt;document.getElementById('syncBanner').classList.add('show')}
function hideBanner(){document.getElementById('syncBanner').classList.remove('show')}

// 家长端：无 token，直接同源 fetch Pages 上的 data.json（不调 GitHub API）
async function pullFromPages(silent){
  _syncing=true;
  if(!silent)showBanner('正在加载云端数据…');
  try{
    const r=await fetch(`${SYNC_BASE}data.json?v=${Date.now()}`,{cache:'no-store'});
    if(!r.ok){if(!silent)toast('云端暂无 data.json，请让老师先点「⬆ 推送」');_syncing=false;if(!silent)hideBanner();return false}
    const dbNew=await r.json();
    clearUrlCache();await fileClear();
    DB=dbNew;saveDB();
    CACHE_BUST=Date.now();clearUrlCache();
    render();
    if(!silent){toast('已加载云端数据');hideBanner()}
    return true;
  }catch(e){
    console.error(e);
    if(!silent){toast('加载失败：'+(e.message||e));hideBanner()}
    return false;
  }finally{_syncing=false}
}

// 拉取云端
async function pullSync(silent){
  if(_syncing)return false;
  if(!SYNC_CFG){if(!silent)toast('请先在「☁ 同步」里填写配置');return false}
  _syncing=true;
  if(!silent)showBanner('正在拉取云端数据…');
  try{
    const j=await ghGetFile('data.json');
    if(!j){if(!silent)toast('云端还没有数据，请先推送');_syncing=false;if(!silent)hideBanner();return false}
    let dbNew;try{dbNew=JSON.parse(atob(j.content.replace(/\n/g,'')))}catch(e){throw new Error('data.json 解析失败')}
    clearUrlCache();
    await fileClear();
    DB=dbNew;saveDB();
    // 拉取所有附件
    const allRecs=[...DB.schedules,...DB.journals,...DB.leaves];
    const metas=[];
    allRecs.forEach(r=>(recFiles(r)||[]).forEach(m=>metas.push(m)));
    let done=0;
    for(const m of metas){
      try{
        const fj=await ghGetFile(`attachments/${m.id}.dat`);
        if(fj){
          const u8=b64ToU8(fj.content.replace(/\n/g,''));
          const blob=new Blob([u8],{type:m.type||'application/octet-stream'});
          await filePut(m.id,m.name,m.type,m.size||blob.size,blob);
        }
      }catch(e){console.warn('附件拉取失败',m.id,e)}
      done++;
      if(!silent)showBanner(`拉取附件 ${done}/${metas.length}`);
    }
    CACHE_BUST=Date.now();clearUrlCache();
    render();
    if(!silent){toast(`已拉取（含 ${metas.length} 个附件）`);hideBanner()}
    return true;
  }catch(e){
    console.error(e);
    if(!silent){toast('拉取失败：'+(e.message||e));hideBanner()}
    return false;
  }finally{_syncing=false}
}

// 推送本地
async function pushSync(){
  if(_syncing)return false;
  if(!SYNC_CFG){toast('请先在「☁ 同步」里填写配置');openSyncCfg();return false}
  if(READONLY){toast('只读模式不能推送');return false}
  _syncing=true;
  showBanner('正在推送…');
  try{
    let remoteList=[];
    try{remoteList=await ghListDir('attachments/')}catch(e){if(e.status!==404)throw e}
    const remoteIds=new Set(remoteList.map(f=>(f.name||'').replace(/\.dat$/,'')));
    const allRecs=[...DB.schedules,...DB.journals,...DB.leaves];
    const localMetas=[];const seen=new Set();
    allRecs.forEach(r=>(recFiles(r)||[]).forEach(m=>{if(!seen.has(m.id)){seen.add(m.id);localMetas.push(m)}}));
    const localIds=new Set(localMetas.map(m=>m.id));
    let attachDone=0;
    for(const m of localMetas){
      if(remoteIds.has(m.id)){attachDone++;continue}
      const rec=await fileGet(m.id);
      if(!rec)continue;
      const b64=await blobToB64Url(rec.blob);
      await ghPutFile(`attachments/${m.id}.dat`,b64,`upload ${m.name}`);
      attachDone++;
      showBanner(`推送附件 ${attachDone}/${localMetas.length}`);
    }
    // 删除云端多余附件
    for(const id of remoteIds){
      if(!localIds.has(id)){
        try{const meta=await ghGetFile(`attachments/${id}.dat`);if(meta)await ghDeleteFile(`attachments/${id}.dat`,meta.sha,`remove orphan ${id}`)}catch(e){console.warn('删除附件失败',id,e)}
      }
    }
    // 推送 data.json（带 sha 乐观锁，409 重试一次）
    const ex=await ghGetFile('data.json');
    const content=strToB64(JSON.stringify(DB));
    let putOk=false,lastErr=null;
    for(let i=0;i<2&&!putOk;i++){
      try{await ghPutFile('data.json',content,'sync data.json',ex&&ex.sha);putOk=true}
      catch(e){
        if(e.status===409&&i===0){const ex2=await ghGetFile('data.json');if(ex2&&ex2.sha){ex.sha=ex2.sha;continue}}
        lastErr=e;break;
      }
    }
    if(!putOk)throw lastErr||new Error('推送失败');
    CACHE_BUST=Date.now();clearUrlCache();
    render();
    toast(`已推送（含 ${localMetas.length} 个附件）`);
    hideBanner();
    return true;
  }catch(e){
    console.error(e);
    toast('推送失败：'+(e.message||e));
    hideBanner();
    return false;
  }finally{_syncing=false}
}
